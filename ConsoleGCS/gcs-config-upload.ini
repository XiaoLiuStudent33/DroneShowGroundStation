# Safety switch is explicit and defaults to true in code.
# Change to false only for a supervised Production MAVLink command test.
safe_test_mode=true

# Production discovery/telemetry mode. Real commands remain disabled until an
# operator explicitly changes real_command_enabled immediately before testing.
mavlink_network_enabled=true
real_command_enabled=false
route_upload_enabled=true
artifact_workspace_root=C:/Users/13092/Documents/DroneGCS/UnrealGCS/Saved/RouteArtifacts
mavlink_bind_ip=192.168.1.254
mavlink_bind_port=10001
heartbeat_timeout_ms=3000

# Production DSP-GCS channel: Console telemetry/results and UE commands.
dspgcs_telemetry_enabled=true
dspgcs_command_enabled=true
dspgcs_transport_config=config/DSPGCSTransport.ini
dspgcs_telemetry_interval_ms=250

# Production performance tuning. Missing keys retain the current code fallback.
[performance]
mavlink_receive_buffer_bytes=4194304
max_packets_per_drain=4096
snapshot_datagram_bytes=61440
snapshot_items_per_chunk=512

[max_flight]
takeoff_altitude_limit=5.0
hover_altitude_limit=5.0
