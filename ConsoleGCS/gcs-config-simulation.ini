# Local UE simulated drones only. Run from the ConsoleGCS directory:
# .\x64\Release\DroneGCS.exe gcs-config-simulation.ini
safe_test_mode=true
mavlink_network_enabled=true
real_command_enabled=true
route_upload_enabled=false
mavlink_bind_ip=127.0.0.1
mavlink_bind_port=10001
heartbeat_timeout_ms=3000
clear_offline_simulation=true
dspgcs_telemetry_enabled=true
dspgcs_command_enabled=true
dspgcs_transport_config=config/DSPGCSTransport.ini
dspgcs_telemetry_interval_ms=250

[performance]
mavlink_receive_buffer_bytes=16777216
max_packets_per_drain=16384
snapshot_datagram_bytes=61440
snapshot_items_per_chunk=512
